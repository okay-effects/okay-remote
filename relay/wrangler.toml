# okay-remote's relay: `sbt relayDist`, then `npx wrangler deploy` (or ./deploy.sh)
name = "okay-remote"
main = "entry.js"
compatibility_date = "2026-10-01"

rules = [{ type = "Text", globs = ["**/*.txt"], fallthrough = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the rooms keep nothing: memory and the sockets' attachments only (the free plan wants SQLite classes; unused)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# the button that opens the page in Telegram (https only)
[vars]
ORIGIN = "https://okay-remote.okay-effects.workers.dev"

# the linking codes are signed tokens now: no object keeps them
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Link"]

[[migrations]]
tag = "v3"
deleted_classes = ["Link"]
